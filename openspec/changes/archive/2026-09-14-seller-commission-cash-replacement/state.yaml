notes: |
  User-authorized decisions: mint the seller_commission voucher at Confirm (not at
  Declare Cash, not by an admin button); residual cash warns but MUST NOT block any
  transition; no backfill of existing sheets, forward-only.
  Confirm-time minting is what removes the reverse/adjustment path: commission_withheld
  is writable only while submitted, and Confirm leaves submitted, so the declaration and
  the voucher amount are locked together in one transaction.
  Phase 0 is a pre-existing defect fix (issued receipts abort replacement) and should
  land as its own PR ahead of the feature.
