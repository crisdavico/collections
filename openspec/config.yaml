schema: spec-driven
project: collection
persistence: openspec
strict_tdd: true

# Session preflight defaults for /sdd-new, /sdd-ff, /sdd-continue
defaults:
  execution_mode: interactive
  artifact_store: openspec
  delivery_strategy: ask-on-risk
  planning_depth: standard
  subagent_model: cursor-grok-4.5-high
  chain_strategy: stacked-to-main

context: |
  Stack: Odoo 19 on Python, PostgreSQL 17, Docker Compose, and Doodba.
  Scope: collection addon (odoo/custom/src/private/collection/) plus coordinated
    Nebula agent at /home/crisd/projects/nebula/nebula-agent.
  Product: Payment vouchers / collections registration for company sellers.
  Models: collection.voucher (standalone per payment); mail.thread + activities.
  MCP: create_collection_vouchers (one voucher per payment; list identity).
  Testing: invoke test -m collection (Odoo TransactionCase in containers);
    nebula-agent uv run make test / integration_tests.
  Quality: pre-commit (Ruff, pylint-odoo, ESLint, Prettier, OCA checks).
  Conventions: repo AGENTS.md + this module's .atl/skill-registry.md.

testing:
  detected: "2026-08-11"
  strict_tdd: true
  runner:
    framework: Odoo native test runner
    command: invoke test -m collection
  layers:
    unit:
      available: true
      tool: Odoo TransactionCase and SavepointCase
    integration:
      available: true
      tool: Containerized Odoo with PostgreSQL
    e2e:
      available: false
      tool: null
  coverage:
    available: false
    command: null
  quality:
    linter:
      available: true
      command: pre-commit run --files odoo/custom/src/private/collection/**
    type_checker:
      available: false
      command: null
    formatter:
      available: true
      command: pre-commit run --files odoo/custom/src/private/collection/**
  notes:
    - Strict TDD enabled; run module tests after each work unit.
    - Prefer scoped pre-commit on collection paths over full-repo lint.
    - Coordinated Nebula changes live under /home/crisd/projects/nebula/nebula-agent.

rules:
  proposal:
    - State user impact, affected models/views, risks, and rollback strategy.
    - Keep Odoo changes inside collection unless dependency configuration must change.
    - Coordinated Nebula MCP rename/list-formatter work is in-scope for this change.
  specs:
    - Use RFC 2119 keywords for requirements.
    - Express acceptance scenarios with Given, When, and Then.
    - Cover authorization, voucher/payment persistence, and UI behavior when relevant.
  design:
    - Follow Odoo 19 patterns and the repository AGENTS.md files.
    - Document model, view, sequence, migration, and security impacts.
    - Include sequence diagrams only for complex cross-component flows.
  tasks:
    - Group tasks into reviewable work units with tests beside implementation.
    - Flag plans that may exceed the 400 changed-line review budget.
    - Include module upgrade and scoped pre-commit verification.
  apply:
    guidelines:
      - Edit owned Odoo code only under odoo/custom/src/private/collection/.
      - Coordinated Nebula edits are allowed under
        /home/crisd/projects/nebula/nebula-agent (MCP name, list formatter, tests,
        collection-voucher-registration spec, AGENTS.md).
      - Do not edit Copier-managed or git-aggregate-managed files directly.
      - Load exact skills from odoo/custom/src/private/collection/.atl/skill-registry.md
        before implementation.
    roots:
      - /home/crisd/projects/seedian/seedian/odoo/custom/src/private/collection
      - /home/crisd/projects/nebula/nebula-agent
    tdd: true
    test_command: invoke test -m collection
  verify:
    test_command: invoke test -m collection
    build_command: invoke img-build
    lint_command: pre-commit run --files odoo/custom/src/private/collection/**
    coverage_threshold: 0
  archive:
    - Warn before merging destructive or backward-incompatible deltas.
    - Preserve archived change artifacts as an immutable audit trail.
